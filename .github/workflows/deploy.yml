name: Deploy to GitHub Pages (ahmad081177.github.io/code-extractor)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code-extractor
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      # Push the built files into the code-extractor/ subfolder of the Pages repo
      - name: Deploy to ahmad081177.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Create a PAT with repo scope and add it as secret PAGES_DEPLOY_TOKEN
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ahmad081177/ahmad081177.github.io
          publish_branch: main
          publish_dir: ./app/dist
          destination_dir: code-extractor
          keep_files: true
          commit_message: "deploy: update code-extractor from ${{ github.sha }}"
